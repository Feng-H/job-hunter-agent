<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job-Hunter OS ｜ 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {50:'#fbfaf9',100:'#f1f1ef',200:'#e9e9e7',300:'#dfddda',400:'#b9b8b6',500:'#9b9a97',600:'#787774',700:'#5f5e5b',800:'#37352f',900:'#2f2c28'},
            indigo: {50:'#e9f3fc',100:'#d3e7fa',200:'#a8cdf5',300:'#6eaeeb',400:'#3b8fe6',500:'#2383e2',600:'#1b6ec2',700:'#1858b0',800:'#174a8f',900:'#173f75'},
            emerald: {50:'#e7f3f0',100:'#cfe7e2',200:'#9fcfc5',300:'#6fb5a7',400:'#478f82',500:'#0f7b6c',600:'#0d6a5d',700:'#0b584c',800:'#094640',900:'#083833'},
            violet: {50:'#f4f2fa',100:'#e8e4f4',400:'#8b7ec8',500:'#6b5f9e',600:'#5a4f86',700:'#4a4170'}
          },
          boxShadow: { sm:'0 1px 2px rgba(15,15,15,0.05)', DEFAULT:'0 1px 3px rgba(15,15,15,0.07)', xl:'0 4px 16px rgba(15,15,15,0.08)' }
        }
      }
    };
  </script>

</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center font-sans p-6">

  <div class="w-full max-w-md">
    <!-- 品牌区 -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto rounded-xl bg-slate-800 text-white flex items-center justify-center text-2xl shadow-sm mb-3">
        🎯
      </div>
      <h1 class="text-2xl font-semibold text-slate-900 tracking-tight">Job-Hunter OS</h1>
      <p class="text-xs text-slate-500 mt-1">基于 Pi Agent 的智能求职协作操作系统</p>
    </div>

    <!-- 卡片 -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-xl p-8">

      <!-- 首次初始化模式 -->
      <div id="box-setup" class="hidden">
        <div class="flex items-center gap-2 mb-1">
          <span class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 border border-emerald-200 flex items-center justify-center text-sm font-bold">🚀</span>
          <h2 class="text-lg font-bold text-slate-900">创建管理员账号</h2>
        </div>
        <p class="text-xs text-slate-500 mb-5 leading-relaxed">
          检测到系统首次启动。为保护您的<b>个人履历、API 密钥与求职数据</b>，请先设置管理员账号；该账号将用于登录看板与授权书签采集。
        </p>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">用户名</label>
            <input id="setup-username" type="text" autocomplete="username" placeholder="2~32 位中英文/数字" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">密码（至少 8 位）</label>
            <input id="setup-password" type="password" autocomplete="new-password" placeholder="建议包含字母、数字与符号" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">确认密码</label>
            <input id="setup-password2" type="password" autocomplete="new-password" placeholder="再次输入密码" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <button onclick="doSetup()" id="btn-setup" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-semibold shadow-sm transition">
            创建账号并进入系统
          </button>
        </div>
      </div>

      <!-- 登录模式 -->
      <div id="box-login" class="hidden">
        <div class="flex items-center gap-2 mb-1">
          <span class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 border border-indigo-200 flex items-center justify-center text-sm font-bold">🔐</span>
          <h2 class="text-lg font-bold text-slate-900">登录工作台</h2>
        </div>
        <p class="text-xs text-slate-500 mb-5">请输入管理员账号以访问您的求职控制台。</p>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">用户名</label>
            <input id="login-username" type="text" autocomplete="username" placeholder="请输入用户名" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">密码</label>
            <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入密码" onkeydown="if(event.key==='Enter') doLogin()" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <button onclick="doLogin()" id="btn-login" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-md transition">
            登 录
          </button>
        </div>
      </div>

      <!-- 提示信息 -->
      <div id="auth-msg" class="mt-4 text-xs font-medium text-center hidden"></div>
    </div>

    <p class="text-center text-[11px] text-slate-400 mt-5">
      🔒 会话有效期 7 天 ｜ 密码使用 scrypt 加盐哈希存储 ｜ 连续 5 次失败将临时锁定
    </p>
  </div>

  <script>
    function showMsg(text, ok) {
      const el = document.getElementById('auth-msg');
      el.classList.remove('hidden', 'text-emerald-600', 'text-rose-600');
      el.classList.add(ok ? 'text-emerald-600' : 'text-rose-600');
      el.innerText = text;
    }

    function busy(btn, text) {
      btn.disabled = true;
      btn.dataset.origin = btn.innerText;
      btn.innerText = text;
    }
    function unbusy(btn) {
      btn.disabled = false;
      btn.innerText = btn.dataset.origin || btn.innerText;
    }

    async function doSetup() {
      const username = document.getElementById('setup-username').value.trim();
      const password = document.getElementById('setup-password').value;
      const password2 = document.getElementById('setup-password2').value;
      const btn = document.getElementById('btn-setup');

      if (!username || !password) return showMsg('请填写用户名与密码', false);
      if (password !== password2) return showMsg('两次输入的密码不一致', false);

      busy(btn, '创建中...');
      try {
        const res = await fetch('/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.code === 0) {
          showMsg('✅ ' + data.message + '，正在进入系统...', true);
          setTimeout(() => location.href = '/', 800);
        } else {
          showMsg(data.message, false);
          unbusy(btn);
        }
      } catch (e) {
        showMsg('网络异常: ' + e.message, false);
        unbusy(btn);
      }
    }

    async function doLogin() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');

      if (!username || !password) return showMsg('请填写用户名与密码', false);

      busy(btn, '登录中...');
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.code === 0) {
          showMsg('✅ 登录成功，正在进入系统...', true);
          setTimeout(() => location.href = '/', 600);
        } else {
          showMsg(data.message, false);
          unbusy(btn);
        }
      } catch (e) {
        showMsg('网络异常: ' + e.message, false);
        unbusy(btn);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/auth/status');
        const data = await res.json();
        if (data.loggedIn) { location.href = '/'; return; }
        if (data.setupMode) {
          document.getElementById('box-setup').classList.remove('hidden');
        } else {
          document.getElementById('box-login').classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('box-login').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
